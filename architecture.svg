<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060"
     font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arw-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arw-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1600" height="1060" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="40" y="46" font-size="27" font-weight="700" fill="#0f172a">dsh-yu-kit 架构</text>
  <text x="40" y="74" font-size="14" fill="#64748b">人格 + 记忆 + 三个内容源 + 两个出口 + 微信 + 多模态 · 装进一个 DSH profile</text>

  <!-- 用户 -->
  <rect x="52" y="360" width="196" height="120" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="150" y="398" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">真人</text>
  <text x="150" y="424" font-size="12" fill="#475569" text-anchor="middle">说话 / 看日报 / 被找</text>
  <text x="150" y="446" font-size="12" fill="#475569" text-anchor="middle">也可能只是路过</text>
  <text x="150" y="468" font-size="11" fill="#94a3b8" text-anchor="middle">（DSH 桌面版 GUI）</text>

  <!-- DSH 宿主 -->
  <rect x="288" y="96" width="856" height="792" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="308" y="126" font-size="15" font-weight="700" fill="#334155">DSH 宿主进程（桌面版 0.2.1-rc.3）</text>
  <text x="308" y="148" font-size="11.5" fill="#94a3b8">所有插件都是它的"器官"；关掉进程，定时任务、主动开口、记忆全部停</text>

  <!-- 人格层 -->
  <rect x="308" y="164" width="816" height="150" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="322" y="186" font-size="12.5" font-weight="700" fill="#7c3aed">人格层</text>

  <rect x="322" y="196" width="386" height="102" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="1.6"/>
  <text x="338" y="220" font-size="14" font-weight="700" fill="#0f172a">dsh-persona-distill</text>
  <text x="338" y="242" font-size="11.5" fill="#475569">每周把原料蒸馏进 ~/.dsh/AGENTS.md 的 AUTO 段</text>
  <text x="338" y="260" font-size="11.5" fill="#475569">每天做一次反面对照：从我自己的原句里挑 AI 味</text>
  <text x="338" y="282" font-size="11" fill="#94a3b8">手写段不动 · 只改 AUTO:BEGIN…AUTO:END</text>

  <rect x="724" y="196" width="386" height="102" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="1.6"/>
  <text x="740" y="220" font-size="14" font-weight="700" fill="#0f172a">dsh-yu-mood</text>
  <text x="740" y="242" font-size="11.5" fill="#475569">每轮聊完自动判断情绪涨跌，右下角挂件能看</text>
  <text x="740" y="260" font-size="11.5" fill="#475569">数值 / 情绪 / 时间线</text>
  <text x="740" y="282" font-size="11" fill="#94a3b8">~/.dsh/feiyu-mood/state.json</text>

  <!-- 记忆层 -->
  <rect x="308" y="330" width="816" height="122" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.2"/>
  <text x="322" y="352" font-size="12.5" font-weight="700" fill="#0284c7">记忆层（被动：自动记、自动淡忘、自动召回）</text>

  <rect x="322" y="362" width="788" height="74" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/>
  <text x="338" y="386" font-size="14" font-weight="700" fill="#0f172a">dsh-yu-memory</text>
  <text x="338" y="408" font-size="11.5" fill="#475569">长期记忆 store.json（remember_global / forget_global）　+　对话记忆 chat.json（每轮记一条，按半衰期淡忘，按问题召回）</text>
  <text x="338" y="427" font-size="11" fill="#94a3b8">~/.dsh/global-memory/　·　不需要手动操作，装上就在记</text>

  <!-- 内容源层 -->
  <rect x="308" y="468" width="816" height="158" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="322" y="490" font-size="12.5" font-weight="700" fill="#16a34a">内容源层（定时刷，用她自己的账号）</text>

  <rect x="322" y="500" width="250" height="110" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="336" y="523" font-size="13.5" font-weight="700" fill="#0f172a">dsh-yu-bili</text>
  <text x="336" y="544" font-size="11" fill="#475569">挑视频 / 读字幕 / 写日报</text>
  <text x="336" y="562" font-size="11" fill="#475569">能发评论、回评论、私信投递</text>
  <text x="336" y="584" font-size="10.5" fill="#94a3b8">bili-duty/voice.md · notes.md</text>
  <text x="336" y="600" font-size="10.5" fill="#94a3b8">需要：扫码登录 + Python venv</text>

  <rect x="590" y="500" width="250" height="110" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="604" y="523" font-size="13.5" font-weight="700" fill="#0f172a">dsh-yu-zhihu</text>
  <text x="604" y="544" font-size="11" fill="#475569">读推荐流与评论</text>
  <text x="604" y="562" font-size="11" fill="#475569">限量点赞 / 评论 / 收藏，能发想法</text>
  <text x="604" y="584" font-size="10.5" fill="#94a3b8">zhihu-duty/ · 需要 zhihu CLI 登录</text>
  <text x="604" y="600" font-size="10.5" fill="#94a3b8">额度：每轮条数在设置里钳</text>

  <rect x="858" y="500" width="252" height="110" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="872" y="523" font-size="13.5" font-weight="700" fill="#0f172a">dsh-yu-weibo</text>
  <text x="872" y="544" font-size="11" fill="#475569">只读：m.weibo.cn 公开接口</text>
  <text x="872" y="562" font-size="11" fill="#475569">访客身份，不登录、不写</text>
  <text x="872" y="584" font-size="10.5" fill="#94a3b8">weibo-duty/</text>
  <text x="872" y="600" font-size="10.5" fill="#94a3b8">写操作需开放平台（默认关）</text>

  <!-- 出口层 -->
  <rect x="308" y="642" width="816" height="152" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="322" y="664" font-size="12.5" font-weight="700" fill="#ea580c">出口层（她说话的地方）</text>

  <rect x="322" y="674" width="250" height="104" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
  <text x="336" y="697" font-size="13.5" font-weight="700" fill="#0f172a">dsh-yu-qq</text>
  <text x="336" y="718" font-size="11" fill="#475569">群聊 / 私聊分会话</text>
  <text x="336" y="736" font-size="11" fill="#475569">点名响应 · 离线补课 · 引用表情</text>
  <text x="336" y="758" font-size="10.5" fill="#94a3b8">需要：OneBot 客户端（NapCat 等）</text>

  <rect x="590" y="674" width="250" height="104" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
  <text x="604" y="697" font-size="13.5" font-weight="700" fill="#0f172a">dsh-yu-speak</text>
  <text x="604" y="718" font-size="11" fill="#475569">按本地概率 + 冷却决定要不要</text>
  <text x="604" y="736" font-size="11" fill="#475569">自己开口找你（不靠你说话触发）</text>
  <text x="604" y="758" font-size="10.5" fill="#94a3b8">调高 = 更主动，也更烧额度</text>

  <rect x="858" y="674" width="252" height="104" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="872" y="697" font-size="13.5" font-weight="700" fill="#0f172a">dsh-wechat-plugin</text>
  <text x="872" y="718" font-size="11" fill="#475569">微信通道（第三方 MIT）</text>
  <text x="872" y="736" font-size="11" fill="#475569">扫码登录后可收发、也能主动推</text>
  <text x="872" y="758" font-size="10.5" fill="#94a3b8">登录态会过期，要重扫</text>

  <!-- 能力层 -->
  <rect x="308" y="810" width="816" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="322" y="832" font-size="12.5" font-weight="700" fill="#475569">能力层</text>
  <rect x="404" y="816" width="392" height="50" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="418" y="838" font-size="12.5" font-weight="700" fill="#0f172a">dsh-agnes-multimodal（第三方 MIT）</text>
  <text x="418" y="856" font-size="10.5" fill="#475569">generate_image / generate_video → Agnes AI 平台</text>
  <text x="812" y="846" font-size="11" fill="#94a3b8">皮肤 / 挂件 / 开机动画 / TTS 不在本包（各装各的）</text>

  <!-- 外部服务 -->
  <text x="1180" y="120" font-size="13" font-weight="700" fill="#334155">外部服务（都要你自己开账号）</text>

  <rect x="1180" y="134" width="376" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1196" y="157" font-size="13" font-weight="700" fill="#0f172a">模型 API</text>
  <text x="1196" y="178" font-size="11" fill="#475569">DeepSeek 官方 key，或任意 OpenAI 兼容网关</text>

  <rect x="1180" y="208" width="376" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1196" y="231" font-size="13" font-weight="700" fill="#0f172a">B站</text>
  <text x="1196" y="252" font-size="11" fill="#475569">扫码登录 → bili_credential.json</text>

  <rect x="1180" y="282" width="376" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1196" y="305" font-size="13" font-weight="700" fill="#0f172a">知乎</text>
  <text x="1196" y="326" font-size="11" fill="#475569">zhihu CLI + 登录态</text>

  <rect x="1180" y="356" width="376" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1196" y="379" font-size="13" font-weight="700" fill="#0f172a">微博</text>
  <text x="1196" y="400" font-size="11" fill="#475569">m.weibo.cn 公开接口（只读不需要登录）</text>

  <rect x="1180" y="430" width="376" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1196" y="453" font-size="13" font-weight="700" fill="#0f172a">QQ</text>
  <text x="1196" y="474" font-size="11" fill="#475569">NapCat 之类 OneBot 实现 + 群号 + 你的 UID</text>

  <rect x="1180" y="504" width="376" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1196" y="527" font-size="13" font-weight="700" fill="#0f172a">微信</text>
  <text x="1196" y="548" font-size="11" fill="#475569">iLink 扫码</text>

  <rect x="1180" y="578" width="376" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1196" y="601" font-size="13" font-weight="700" fill="#0f172a">Agnes AI</text>
  <text x="1196" y="622" font-size="11" fill="#475569">platform.agnes-ai.cn 建 key</text>

  <!-- 连线：插件 → 外部服务 -->
  <path d="M 1148 217 L 1180 227" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arw-ext)"/>
  <path d="M 1110 555 L 1180 237" stroke="#94a3b8" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arw-ext)"/>
  <path d="M 1110 555 L 1180 311" stroke="#94a3b8" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arw-ext)"/>
  <path d="M 1110 555 L 1180 385" stroke="#94a3b8" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arw-ext)"/>
  <path d="M 572 726 L 1180 459" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arw-ext)"/>
  <path d="M 984 726 L 1180 533" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arw-ext)"/>
  <path d="M 796 841 L 1180 607" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arw-ext)"/>

  <!-- 连线：用户 ↔ 出口层 -->
  <path d="M 248 400 L 322 690" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
  <text x="238" y="560" font-size="11" fill="#475569" transform="rotate(72 238 560)">发消息</text>
  <path d="M 322 750 L 248 470" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
  <text x="196" y="640" font-size="11" fill="#475569" transform="rotate(-72 196 640)">回话 / 自己找上门</text>

  <!-- 底部闭环 -->
  <rect x="40" y="906" width="1516" height="128" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.3"/>
  <text x="58" y="932" font-size="13" font-weight="700" fill="#6d28d9">闭环：原料 → 人格 → 表达（这套东西真正在长的地方）</text>

  <rect x="58" y="946" width="330" height="72" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="1.4"/>
  <text x="72" y="968" font-size="12" font-weight="700" fill="#0f172a">① 刷内容，留下原料</text>
  <text x="72" y="988" font-size="10.5" fill="#475569">voice.md（人怎么说话）· notes.md（踩过的坑）</text>
  <text x="72" y="1006" font-size="10.5" fill="#94a3b8">digest/&lt;月&gt;.md（看过什么）</text>

  <path d="M 388 982 L 424 982" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arw-strong)"/>

  <rect x="428" y="946" width="330" height="72" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="1.4"/>
  <text x="442" y="968" font-size="12" font-weight="700" fill="#0f172a">② 蒸馏（每周一次）</text>
  <text x="442" y="988" font-size="10.5" fill="#475569">persona-distill 只写 AUTO 段</text>
  <text x="442" y="1006" font-size="10.5" fill="#94a3b8">反面对照：从我自己的原句里找 AI 味</text>

  <path d="M 758 982 L 794 982" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arw-strong)"/>

  <rect x="798" y="946" width="330" height="72" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="1.4"/>
  <text x="812" y="968" font-size="12" font-weight="700" fill="#0f172a">③ ~/.dsh/AGENTS.md</text>
  <text x="812" y="988" font-size="10.5" fill="#475569">手写段（人写，永不被覆盖）+ AUTO 段（机器写）</text>
  <text x="812" y="1006" font-size="10.5" fill="#94a3b8">每次开会话都读它</text>

  <path d="M 1128 982 L 1164 982" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arw-strong)"/>

  <rect x="1168" y="946" width="370" height="72" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="1.4"/>
  <text x="1182" y="968" font-size="12" font-weight="700" fill="#0f172a">④ 带着这个人格说话 / 互动</text>
  <text x="1182" y="988" font-size="10.5" fill="#475569">说出的话被 mood 记下、被 memory 记住</text>
  <text x="1182" y="1006" font-size="10.5" fill="#94a3b8">下一轮的原料又从这里长出来 ↺</text>

  <!-- 图例 -->
  <rect x="1180" y="660" width="376" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="1196" y="682" font-size="12" font-weight="700" fill="#334155">图例</text>
  <rect x="1196" y="692" width="26" height="12" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="1232" y="703" font-size="11" fill="#475569">实线框 = 自研插件（MIT）</text>
  <rect x="1196" y="712" width="26" height="12" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="1232" y="723" font-size="11" fill="#475569">虚线框 = 第三方插件（MIT，版权归原作者）</text>
  <path d="M 1196 740 L 1222 740" stroke="#7c3aed" stroke-width="2" marker-end="url(#arw-strong)"/>
  <text x="1232" y="744" font-size="11" fill="#475569">紫色箭头 = 人格生长闭环　灰色箭头 = 数据流向</text>
</svg>
