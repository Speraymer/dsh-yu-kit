#             input: [ text ]

# --- 刷B站 -------------------------------------------------------------------
# {{...}} 由安装脚本替换；手动装的话自己改成真实值。
- id: bili-scroll
  name: dsh-yu-bili
  config:
    enabled: true
    perDay: 50
    peakValley: true
    # 想要它自己发评论就打开下面两行；默认关，先看它怎么写东西再决定。
    autoComment: false
    # 私信投递：off / only（只私信你）/ both（私信 + 公开评论）
    dmMode: only
    dmUid: {{OWNER_UID}}
    trustedCommandUid: {{OWNER_UID}}
    transcribe: true
    mentionName: "{{BILI_MENTION}}"
    keywords:
      - 搞笑视频
      - 抽象视频
      - DSH
      - AI新闻
    pythonPath: "{{PYTHON}}"
    personaPrompt: ""
    workspace: "{{WORKSPACE}}"
    reportLevel: full
    replyToComments: false

# --- 定时任务用哪个模型 -------------------------------------------------------
# 上面 bili 那段只是 B站自己的；知乎/微博/人格蒸馏各有自己的 provider/model，
# 在各自的设置页里填。想统一指到某个网关，四处的 provider 都填成同一个路由名。
